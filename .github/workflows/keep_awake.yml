name: Wake Up All Apps

on:
  schedule:
    - cron: '0 */8 * * *' # 8시간마다 정각에 실행 (한국 시간 기준 09:00, 17:00, 01:00)
    
  workflow_dispatch:

jobs:
  ping_apps:
    runs-on: ubuntu-latest
    env:
      # Node.js 20 경고 해결을 위한 환경 변수 추가
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          
      - name: Setup Python & Install Dependencies
        run: |
          # 1. 프로젝트 독립 가상 환경 생성
          uv venv
          
          # 2. pyproject.toml 의존성과 플레이라이트 패키지 동시 설치
          uv pip install -r pyproject.toml playwright
          
          # 3. 가상 환경 내부의 플레이라이트 도구를 사용하여 크롬 바이너리 빌드
          uv run playwright install chromium
        
      - name: Run Headless Browser Script
        working-directory: src
        run: |
          # 가상 환경 파이썬 인터프리터를 통한 스크립트 구동
          uv run python keep_alive.py