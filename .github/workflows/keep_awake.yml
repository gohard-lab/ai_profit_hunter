name: Wake Up All Apps

on:
  schedule:
    - cron: '0 */8 * * *' # 8시간마다 정각에 실행 (한국 시간 기준 09:00, 17:00, 01:00)
    
  workflow_dispatch:

jobs:
  ping_apps:
    runs-on: ubuntu-latest
    env:
      # Node.js 20 경고 해결을 위한 환경 변수 추가
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          
      - name: Setup Python & Install Dependencies
        run: |
          # 1. 시스템 영역 대신 우리만의 독립된 가상 환경을 만듭니다.
          uv venv
          # 2. --system 옵션을 빼고 가상 환경 안에 안전하게 패키지를 설치합니다.
          uv pip install -r pyproject.toml
        
      - name: Run Headless Browser Script
        working-directory: src
        run: |
          # 가상 환경의 파이썬 인터프리터로 스크립트를 명시적으로 실행합니다.
          uv run python keep_alive.py